name: Deploy site

# The published site is the html in site/ plus data/ next to it. On github.io the
# pages fetch data/<file> from that same site, including data/trends.csv.
# A normal push of site/ or data/ starts this workflow. A commit made with the
# Actions token does not: GitHub ignores that push for other workflows. The
# scheduled data jobs call this workflow themselves after they push data
# (workflow_call), and pass the new commit.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to publish. The data job passes the commit it just pushed."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push: that commit. A data job: the commit it just pushed. A manual run: the branch tip.
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.event_name == 'push' && github.sha || github.ref_name }}
      - name: Put the pages and the data files in one folder
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -a site/. _site/
          cp -a data/. _site/data/
          test -s _site/data/trends.csv
          test -s _site/data/meta.json
          test -f _site/chart-viewer.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
