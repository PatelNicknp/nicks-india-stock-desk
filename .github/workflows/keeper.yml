name: Update keeper

# The desk's own clock, so updates do not depend only on GitHub cron (which runs hours late or not at all).
# One keeper job is always alive: it sleeps until 10 minutes past the next India slot (08:00, 16:30 and
# 18:30 IST, Monday to Friday, NSE trading holidays skipped), checks whether that slot ran, and if not
# dispatches exactly one update of that slot's mode. 45 minutes past the slot it checks the run succeeded
# (and for the close and retry runs that price_as_of reached that IST date); a failed slot gets one retry.
# After about 5.5 hours it starts the next keeper and exits (hosted jobs stop at 6h). It reads no market data.
# Switch: features.self_heal_keeper in config.json (read live from main); off means the keeper stops and
# does not chain. Every update and watchdog run restarts a keeper if none is live.
on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

# Only one keeper runs at a time. A second one waits, and the newest waiting one replaces older ones.
concurrency:
  group: india-update-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config.json
            keeper.py
          sparse-checkout-cone-mode: false
      - name: Sleep to each slot, make up a missed one, retry a failed one once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -u keeper.py keeper
