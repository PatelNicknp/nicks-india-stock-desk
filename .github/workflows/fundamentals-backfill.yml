name: Financials and shareholding backfill

on:
  schedule:
    # GitHub delays and drops scheduled runs that land on the hour and the half hour.
    # The second line starts the same job at :15 and :45 so a quiet hour still gets a run.
    # The concurrency group below keeps two starts from downloading at the same time.
    - cron: "*/30 * * * *"
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nick-india-fundamentals-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Download the next batch
        run: python fundamentals_backfill.py
      - name: Save the batch
        run: |
          git config user.name "india-stock-desk-bot"
          git config user.email "india-stock-desk-bot@users.noreply.github.com"
          git add \
            cache/annual.csv \
            cache/quarters.csv \
            cache/yahoo_info.csv \
            cache/earnings.csv \
            cache/holders.csv \
            cache/backfill_cursor.json \
            cache/company_profiles.csv \
            data/backfill_progress.csv \
            data/company_lines.csv
          if git diff --cached --quiet; then
            echo "No financials changes."
            exit 0
          fi
          git commit -m "Backfill financials and shareholding $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep $((i * 5))
          done
