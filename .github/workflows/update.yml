name: Update Nick's India Stock Desk

on:
  schedule:
    # Light morning run, 08:00 IST. News and FII/DII only. No prices.
    - cron: "30 2 * * 1-5"
    # Main run after the NSE close, 16:30 IST. Daily bhavcopy and the slow facts.
    - cron: "0 11 * * 1-5"
    # Retry if the bhavcopy file is late, 18:30 IST. Last few sessions only.
    - cron: "0 13 * * 1-5"
  # The crons above stay as the main schedule. The keeper workflow (keeper.yml) makes up a slot GitHub
  # skipped and retries a failed one once; the Schedule watchdog is the fallback when no keeper is live.
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run: close (16:30 IST main run, the default as before), morning (08:00 IST news and FII/DII), retry (18:30 IST late bhavcopy)"
        required: false
        default: "close"
        type: choice
        options: ["close", "morning", "retry"]
      reason:
        description: "Set to keeper or keeper_retry by the keeper workflow. Leave blank for a manual run."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: nick-india-stock-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Scheduled runs and keeper make-ups: a late cron and a make-up for the same slot collapse into one.
      # GitHub often fires this repo's crons hours late, so a scheduled run belongs to the time its cron was due.
      # Manual runs, watchdog starts and the keeper's single retry of a failed slot (keeper_retry) are never skipped.
      # If the run list cannot be read, the update runs as it always did.
      - name: Skip a duplicate run for the same slot
        id: guard
        if: github.event_name == 'schedule' || inputs.reason == 'keeper'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REASON: ${{ inputs.reason }}
          MODE: ${{ inputs.mode }}
        run: python3 keeper.py guard
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run the tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          python tests/test_net.py
          python tests/test_scoring.py
          python tests/test_fundamentals.py
          python tests/test_universe.py
          python tests/test_job.py
          python tests/test_setups.py
          python tests/test_keeper.py
      - name: Update the desk
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          sched="${{ github.event.schedule }}"
          # A manual run is the close run, as before (mode defaults to close). A keeper run uses its slot's mode.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "$sched" = "0 11 * * 1-5" ]; then
            mode=close
          elif [ "$sched" = "0 13 * * 1-5" ]; then
            mode=retry
          else
            mode=morning
          fi
          case "$mode" in
            morning) python stock_desk.py --morning ;;
            retry) python stock_desk.py --retry ;;
            *) python stock_desk.py --close ;;
          esac
      - name: Save the new numbers
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "india-stock-desk-bot"
          git config user.email "india-stock-desk-bot@users.noreply.github.com"
          git add data cache
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update desk data $(date -u +%Y-%m-%dT%H:%MZ)"
            # The backfill job commits too, so catch up with main before pushing.
            # If the same file changed in both, this run's newer copy wins.
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
                git push && exit 0
              else
                git rebase --abort || true
              fi
              sleep $((i * 5))
            done
            echo "Could not save after 5 tries."
            exit 1
          fi

  # Second way in for the keeper: if no keeper is queued or running (chain broken), start one.
  # Does nothing when one is live or features.self_heal_keeper is off. Reads no market data.
  keeper:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config.json
            keeper.py
          sparse-checkout-cone-mode: false
      - name: Start a keeper if none is live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 keeper.py ensure-keeper
